<script>
/* Include this fragment in the final Apps Script Index.html. It does not render UI. */
const TeamRpc = (() => {
  const allowed = new Set(['getDay', 'saveAttendance']);
  function call(method, payload, timeoutMs = 20000) {
    if (!allowed.has(method)) return Promise.reject(new Error('INVALID_METHOD'));
    return new Promise((resolve, reject) => {
      let settled = false;
      const timer = setTimeout(() => {
        settled = true;
        reject(new Error('UNKNOWN'));
      }, timeoutMs);
      const finish = (fn, value) => {
        clearTimeout(timer);
        if (!settled) { settled = true; fn(value); }
      };
      google.script.run
        .withSuccessHandler(value => finish(resolve, value))
        .withFailureHandler(error => finish(reject, error))[method](payload);
    });
  }
  // Keep this exact object while pending or UNKNOWN. Retrying a timeout MUST
  // reuse requestId, status and expectedRevision. Do not generate a new UUID.
  function attendanceCommand(dateKey, employeeId, status, expectedRevision) {
    return { dateKey, employeeId, status, expectedRevision, requestId: crypto.randomUUID() };
  }
  return { call, attendanceCommand };
})();

/* Example guard against a slow response overwriting the newly selected day. */
function makeDayLoader(render, showError) {
  let generation = 0;
  return async dateKey => {
    const current = ++generation;
    try {
      const result = await TeamRpc.call('getDay', dateKey);
      if (generation === current) render(result);
    } catch (error) {
      if (generation === current) showError(error);
    }
  };
}
</script>
