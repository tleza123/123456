<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DE TEAM — ตัวอย่างเว็บเช็คชื่อ</title>
<style>
html{font-size:15px;scrollbar-gutter:stable}body{margin:0;padding:1rem;background:#e8eef5;min-height:100dvh}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #004e98;outline-offset:3px}
@media(min-width:640px){html{font-size:15.5px}}@media(min-width:1024px){html{font-size:16px}}@media(min-width:1440px){html{font-size:16.5px}}@media(min-width:1920px){html{font-size:17.5px}}
@media(max-width:639px){body{padding:0}#team-attendance-demo .team-shell{border-radius:0}#team-attendance-demo .team-main{padding-bottom:calc(6rem + env(safe-area-inset-bottom))}#team-attendance-demo .team-navigation{position:fixed;bottom:0;left:0;right:0;margin-inline:auto;width:min(100%,29rem);padding-bottom:calc(.55rem + env(safe-area-inset-bottom));z-index:10}}
</style></head><body>
<div id="team-attendance-demo" lang="th" aria-label="ตัวอย่างเว็บเช็คชื่อพนักงาน">
  <style>
    #team-attendance-demo { --team-primary:#003566; --team-gold:#ffc300; --team-copy:1.2rem; color:#172b43; font-family:Sarabun,Tahoma,sans-serif; font-size:var(--team-copy); line-height:1.65; letter-spacing:normal; max-width:29rem; margin-inline:auto; color-scheme:light; }
    #team-attendance-demo * { box-sizing:border-box; }
    #team-attendance-demo .team-shell { background:#f3f6fa; border:1px solid #d7e0ea; border-radius:1.4rem; overflow:clip; }
    #team-attendance-demo .team-header { background:var(--team-primary); color:#fff; padding:1.15rem 1.2rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    #team-attendance-demo .team-brand { letter-spacing:.05em; font-size:1rem; font-weight:700; }
    #team-attendance-demo .team-brand span { color:var(--team-gold); }
    #team-attendance-demo .team-demo { font-size:1rem; color:#fff; }
    #team-attendance-demo .team-main { padding:1.2rem 1.067rem; }
    #team-attendance-demo h2 { font-size:1.67rem; line-height:1.3; margin:0 0 1rem; color:#001d3d; font-weight:700; }
    #team-attendance-demo h3 { font-size:1.33rem; line-height:1.3; margin:0; font-weight:700; overflow-wrap:anywhere; }
    #team-attendance-demo p { margin:.2rem 0; }
    #team-attendance-demo .team-secondary { color:#526277; font-size:1.067rem; }
    #team-attendance-demo button, #team-attendance-demo input, #team-attendance-demo select, #team-attendance-demo textarea { font:inherit; letter-spacing:normal; }
    #team-attendance-demo button { min-height:3.467rem; border:1px solid #bdcada; border-radius:.8rem; padding:.6rem .7rem; background:#fff; color:var(--team-primary); cursor:pointer; touch-action:manipulation; user-select:none; -webkit-tap-highlight-color:transparent; }
    #team-attendance-demo button:hover { border-color:var(--team-primary); }
    #team-attendance-demo .team-primary { background:var(--team-primary); color:#fff; border-color:var(--team-primary); font-weight:700; }
    #team-attendance-demo .team-wide { width:100%; }
    #team-attendance-demo .team-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
    #team-attendance-demo label { display:block; margin-bottom:1rem; }
    #team-attendance-demo input, #team-attendance-demo select, #team-attendance-demo textarea { display:block; min-height:3.467rem; margin-top:.4rem; padding:.6rem .7rem; border:1px solid #a7b7ca; border-radius:.65rem; background:#fff; color:#172b43; width:100%; min-width:0; max-width:100%; }
    #team-attendance-demo input[type=file] { font-size:1.067rem; }
    #team-attendance-demo textarea { min-height:6rem; resize:vertical; }
    #team-attendance-demo .team-person { background:#fff; border:1px solid #d7e0ea; border-radius:1.067rem; padding:1.067rem; margin-bottom:1rem; }
    #team-attendance-demo .team-person-head { display:flex; align-items:center; gap:.8rem; margin-bottom:.9rem; }
    #team-attendance-demo .team-name { min-width:0; flex:1; }
    #team-attendance-demo .team-avatar { flex:0 0 3.5rem; width:3.5rem; height:4rem; border-radius:.65rem; background:#edf2f7; color:#526277; display:flex; align-items:center; justify-content:center; font-weight:700; overflow:hidden; }
    #team-attendance-demo .team-avatar img { max-width:100%; width:auto; height:auto; max-height:100%; object-fit:contain; }
    #team-attendance-demo .team-statuses { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.533rem; }
    #team-attendance-demo .team-statuses button { padding:.55rem .1rem; font-size:var(--team-copy); }
    #team-attendance-demo .team-statuses [aria-pressed=true] { font-weight:700; border-width:2px; }
    #team-attendance-demo .team-statuses [data-status=FULL][aria-pressed=true] { background:#f0fdf4; color:#166534; border-color:#166534; }
    #team-attendance-demo .team-statuses [data-status=HALF][aria-pressed=true] { background:#fffbeb; color:#854d0e; border-color:#854d0e; }
    #team-attendance-demo .team-statuses [data-status=ABSENT][aria-pressed=true] { background:#fef2f2; color:#991b1b; border-color:#991b1b; }
    #team-attendance-demo .team-saved { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:.3rem; font-size:1.067rem; color:#526277; margin-top:.6rem; min-height:3rem; }
    #team-attendance-demo .team-text-button { border-color:transparent; min-height:3rem; font-size:1.067rem; padding:.3rem; text-decoration:underline; text-underline-offset:.2rem; }
    #team-attendance-demo .team-summary { border-radius:1.067rem; background:var(--team-primary); color:#fff; padding:1.2rem; margin-bottom:1rem; }
    #team-attendance-demo .team-money { font-size:2rem; line-height:1.3; font-weight:700; margin:.3rem 0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    #team-attendance-demo .team-summary .team-secondary { color:#e1eaf4; }
    #team-attendance-demo .team-report-row { display:block; text-align:left; width:100%; padding:1.067rem; margin-bottom:1rem; border:1px solid #d7e0ea; background:#fff; border-radius:1.067rem; }
    #team-attendance-demo .team-report-name { display:flex; justify-content:space-between; align-items:center; gap:.8rem; }
    #team-attendance-demo .team-row-money { font-size:1.5rem; font-weight:700; color:#001d3d; margin:.3rem 0; font-variant-numeric:tabular-nums; }
    #team-attendance-demo .team-counts { display:flex; flex-wrap:wrap; gap:.3rem 1rem; color:#526277; font-size:1.067rem; }
    #team-attendance-demo .team-kpis { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin-bottom:1.2rem; }
    #team-attendance-demo .team-kpi { padding:.8rem; background:#fff; border:1px solid #d7e0ea; border-radius:.8rem; }
    #team-attendance-demo .team-kpi strong { display:block; font-size:1.5rem; color:#001d3d; }
    #team-attendance-demo .team-line { display:flex; justify-content:space-between; gap:.8rem; padding:.7rem 0; border-bottom:1px solid #e1e7ee; }
    #team-attendance-demo .team-line span:first-child { min-width:0; overflow-wrap:anywhere; }
    #team-attendance-demo .team-line span:last-child { flex-shrink:0; font-variant-numeric:tabular-nums; }
    #team-attendance-demo .team-notice { background:#fff9e6; border:1px solid #dac576; border-radius:.8rem; padding:.8rem; color:#63480c; margin-bottom:1rem; }
    #team-attendance-demo .team-navigation { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); padding:.55rem .6rem; gap:.4rem; border-top:1px solid #d7e0ea; background:#fff; }
    #team-attendance-demo .team-navigation button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; border-color:transparent; font-size:1.067rem; padding:.6rem .1rem; }
    #team-attendance-demo .team-navigation [aria-current=page] { color:var(--team-primary); background:#e9f1f9; border-bottom:3px solid var(--team-gold); font-weight:700; }
    #team-attendance-demo .team-navigation svg { width:1.4rem; height:1.4rem; }
    #team-attendance-demo .team-extra { background:#f3f6fa; padding:.8rem; border-radius:.8rem; margin:1rem 0; }
    #team-attendance-demo .team-form-actions { display:grid; gap:.7rem; margin-top:1rem; }
    #team-attendance-demo .team-file-preview { max-width:10rem; height:auto; display:block; margin:.6rem 0; }
    #team-attendance-demo .team-live { min-height:1.8rem; font-size:1.067rem; margin:.3rem 0 .8rem; }
    @media (max-width:350px) { #team-attendance-demo .team-main { padding:1rem .7rem; } #team-attendance-demo .team-person { padding:.85rem .7rem; } }
    @media (pointer:coarse) { #team-attendance-demo input, #team-attendance-demo textarea, #team-attendance-demo select { font-size:max(var(--team-copy),16px)!important; } }
    @media (prefers-reduced-motion:reduce) { #team-attendance-demo * { scroll-behavior:auto; } }
  </style>
  <div class="team-shell">
    <header class="team-header"><div class="team-brand">DE <span>TEAM</span></div><span class="team-demo">ข้อมูลตัวอย่าง</span></header>
    <div class="team-main">
      <div id="team-demo-content"></div>
      <p id="team-demo-live" class="team-live" role="status" aria-live="polite"></p>
    </div>
    <nav class="team-navigation" aria-label="เมนูหลัก">
      <button type="button" data-tab="attendance" aria-current="page"><i data-lucide="clipboard-check" aria-hidden="true"></i>เช็คชื่อ</button>
      <button type="button" data-tab="reports"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>รายงาน</button>
      <button type="button" data-tab="settings"><i data-lucide="settings" aria-hidden="true"></i>ตั้งค่า</button>
    </nav>
  </div>
  <script>
  (() => {
    const root = document.getElementById('team-attendance-demo');
    const content = root.querySelector('#team-demo-content');
    const live = root.querySelector('#team-demo-live');
    const today = '2026-09-14';
    const label = { FULL:'เต็มวัน', HALF:'ครึ่งวัน', ABSENT:'ไม่มา' };
    const money = n => (n / 100).toLocaleString('th-TH', { minimumFractionDigits:2, maximumFractionDigits:2 });
    const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const thaiDate = (date, options = { day:'numeric', month:'short' }) => new Intl.DateTimeFormat('th-TH', options).format(new Date(date + 'T12:00:00+07:00'));
    const state = { tab:'attendance', date:today, month:'2026-09', filter:false, detail:null, edit:null, photo:'', extras:[], fontSize:1.2 };
    const people = [
      { id:'demo-1', name:'สมชาย ใจดี', nickname:'ชาย', position:'ช่างติดตั้ง', start:'2026-08-01', notes:'', photo:'', rates:[{date:'2026-08-01',amount:50000}], extras:[{label:'ค่าเดินทาง',amount:150000},{label:'ค่าอาหาร',amount:100000}] },
      { id:'demo-2', name:'มาลี แสงทอง', nickname:'ลี', position:'ผู้ช่วยช่าง', start:'2026-08-01', notes:'', photo:'', rates:[{date:'2026-08-01',amount:45000}], extras:[{label:'ค่าเดินทาง',amount:100000}] },
      { id:'demo-3', name:'วิชัย มีสุข', nickname:'ชัย', position:'คนขับรถ', start:'2026-08-01', notes:'', photo:'', rates:[{date:'2026-08-01',amount:55000}], extras:[{label:'ค่าเดินทาง',amount:150000}] }
    ];
    const records = new Map();
    const monthlyExtras = new Map();
    const monthDates = month => { const a=[]; const d=new Date(month+'-01T00:00:00Z'); while(d.toISOString().slice(0,7)===month){ a.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); } return a; };
    const workday = date => new Date(date+'T00:00:00Z').getUTCDay() !== 0;
    for (const month of ['2026-08','2026-09']) {
      people.forEach((person,index) => {
        monthlyExtras.set(month+'|'+person.id,person.extras.map(x=>({...x})));
        monthDates(month).filter(date=>date<today&&workday(date)).forEach((date,i) => records.set(date+'|'+person.id, i===4+index ? 'HALF' : i===8+index ? 'ABSENT':'FULL'));
      });
    }
    records.set(today+'|demo-1','FULL'); records.set(today+'|demo-2','HALF');
    const rateOn = (person,date) => person.rates.filter(r=>r.date<=date).at(-1)?.amount || 0;
    const avatar = person => `<div class="team-avatar">${person.photo ? `<img src="${person.photo}" alt="รูป${escape(person.name)}">` : escape(person.name.slice(0,1))}</div>`;
    const announce = text => { live.textContent=text; };
    const report = person => {
      const r={full:0,half:0,absent:0,pending:0,base:0,extras:monthlyExtras.get(state.month+'|'+person.id)||[],days:[]};
      monthDates(state.month).filter(date=>date<=today&&date>=person.start&&workday(date)).forEach(date=>{
        const status=records.get(date+'|'+person.id); const rate=rateOn(person,date);
        const amount=status==='FULL'?rate:status==='HALF'?Math.floor((rate+1)/2):status==='ABSENT'?0:null;
        if(status==='FULL')r.full++; else if(status==='HALF')r.half++; else if(status==='ABSENT')r.absent++; else r.pending++;
        r.base+=amount||0; r.days.push({date,status,amount});
      });
      r.extra=r.extras.reduce((a,x)=>a+x.amount,0); r.total=r.base+r.extra; return r;
    };
    function attendanceCard(person) {
      const status=records.get(state.date+'|'+person.id);
      return `<article class="team-person" data-person="${person.id}"><div class="team-person-head">${avatar(person)}<div class="team-name"><h3>${escape(person.name)}</h3><p class="team-secondary">${escape(person.position)}</p></div></div><div class="team-statuses" role="group" aria-label="เช็คชื่อ ${escape(person.name)}">${Object.entries(label).map(([key,text])=>`<button type="button" data-mark="${person.id}" data-status="${key}" aria-pressed="${status===key}">${text}</button>`).join('')}</div><div class="team-saved"><span>${status?label[status]+' · เลือกแล้ว':'ยังไม่เช็ค'}</span>${status?`<button class="team-text-button" type="button" data-clear="${person.id}">ล้างรายการ</button>`:''}</div></article>`;
    }
    function attendanceView() {
      const eligible=people.filter(p=>p.start<=state.date); const checked=eligible.filter(p=>records.has(state.date+'|'+p.id)).length;
      content.innerHTML=`<h2>เช็คชื่อ</h2><label>วันที่<input aria-label="วันที่เช็คชื่อ" type="date" id="team-date" min="2026-08-01" max="${today}" value="${state.date}"></label><p class="team-secondary">${thaiDate(state.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><div class="team-toolbar"><p id="team-checked" class="team-secondary">เช็คแล้ว ${checked} จาก ${eligible.length} คน</p><button type="button" class="team-text-button" id="team-filter" aria-pressed="${state.filter}">${state.filter?'ดูทั้งหมด':'ดูที่ยังไม่เช็ค'}</button></div><div id="team-person-list">${!workday(state.date)?'<div class="team-notice">วันหยุดตามตาราง</div>':eligible.filter(p=>!state.filter||!records.has(state.date+'|'+p.id)).map(attendanceCard).join('')||'<p>เช็คชื่อครบแล้ว</p>'}</div>`;
    }
    function reportsView() {
      const rows=people.filter(p=>p.start.slice(0,7)<=state.month).map(p=>({person:p,r:report(p)}));
      if(state.detail){ detailView(people.find(p=>p.id===state.detail)); return; }
      const total=rows.reduce((a,x)=>a+x.r.total,0); const pending=rows.reduce((a,x)=>a+x.r.pending,0);
      content.innerHTML=`<h2>รายงาน</h2><label>เดือน<select id="team-month"><option value="2026-09" ${state.month==='2026-09'?'selected':''}>กันยายน 2569</option><option value="2026-08" ${state.month==='2026-08'?'selected':''}>สิงหาคม 2569</option></select></label><div class="team-summary"><p>ยอดค่าจ้างเดือนนี้</p><p class="team-money">${money(total)}</p><p>บาท</p><p class="team-secondary">${state.month==='2026-09'?'ค่าแรงสะสมถึง 14 ก.ย.':'ยอดรายเดือน'} + เงินพิเศษ</p></div>${pending?`<div class="team-notice">ยังไม่เช็ค ${pending} รายการ</div>`:''}${rows.map(({person:p,r})=>`<button type="button" class="team-report-row" data-detail="${p.id}"><div class="team-report-name"><h3>${escape(p.name)}</h3><span aria-hidden="true">›</span></div><p class="team-row-money">${money(r.total)} บาท</p><div class="team-counts"><span>เต็มวัน ${r.full}</span><span>ครึ่งวัน ${r.half}</span><span>ไม่มา ${r.absent}</span></div>${r.pending?`<p class="team-secondary">ยังไม่เช็ค ${r.pending} วัน</p>`:''}</button>`).join('')}`;
    }
    function detailView(person) {
      const r=report(person);
      content.innerHTML=`<button type="button" class="team-text-button" id="team-back-report">กลับรายงาน</button><h2>${escape(person.name)}</h2><p class="team-secondary">${state.month==='2026-09'?'กันยายน':'สิงหาคม'} 2569</p><div class="team-summary"><p>ยอดค่าจ้าง</p><p class="team-money">${money(r.total)}</p><p>บาท</p></div><div class="team-kpis"><div class="team-kpi"><span>เต็มวัน</span><strong>${r.full} วัน</strong></div><div class="team-kpi"><span>ครึ่งวัน</span><strong>${r.half} วัน</strong></div><div class="team-kpi"><span>ไม่มา</span><strong>${r.absent} วัน</strong></div><div class="team-kpi"><span>วันคิดค่าจ้าง</span><strong>${r.full+r.half/2} วัน</strong></div></div>${r.pending?`<div class="team-notice">ยังไม่เช็ค ${r.pending} วัน</div>`:''}<section class="team-person"><h3>รายละเอียดเงิน</h3><div class="team-line"><span>ค่าแรงรวม</span><span>${money(r.base)}</span></div>${r.extras.map(x=>`<div class="team-line"><span>${escape(x.label)}</span><span>${money(x.amount)}</span></div>`).join('')||'<p class="team-secondary">ไม่มีเงินพิเศษ</p>'}<div class="team-line"><strong>รวม</strong><strong>${money(r.total)}</strong></div></section><h3>รายการเช็คชื่อ</h3>${r.days.map(d=>`<div class="team-line"><span>${thaiDate(d.date)}<br><span class="team-secondary">${label[d.status]||'รอเช็ค'}</span></span><span>${d.amount===null?'—':money(d.amount)}</span></div>`).join('')}`;
    }
    function settingsView() {
      if(state.edit!==null){ editView(); return; }
      content.innerHTML=`<h2>ตั้งค่า</h2><button class="team-primary team-wide" type="button" id="team-add-person">เพิ่มพนักงาน</button><div style="margin-top:1rem">${people.map(p=>`<article class="team-person"><div class="team-person-head">${avatar(p)}<div class="team-name"><h3>${escape(p.name)}</h3><p class="team-secondary">${escape(p.position)}</p></div></div><p>${money(rateOn(p,today))} บาทต่อวัน</p><p class="team-secondary">เงินพิเศษ ${p.extras.length} รายการ</p><button type="button" class="team-wide" data-edit="${p.id}">แก้ไข</button></article>`).join('')}</div><p class="team-secondary">วันทำงาน: จันทร์–เสาร์</p>`;
    }
    function openEdit(id) {
      const p=people.find(p=>p.id===id); state.edit=id||'new'; state.photo=p?.photo||''; state.extras=p?p.extras.map(x=>({...x})):[]; render();
    }
    function extrasMarkup() {
      return state.extras.map((x,i)=>`<div class="team-extra"><label>ชื่อรายการ<input name="extra-label-${i}" maxlength="80" required value="${escape(x.label)}"></label><label>จำนวนบาทต่อเดือน<input name="extra-amount-${i}" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" required value="${(x.amount/100).toFixed(2)}"></label><button type="button" data-remove-extra="${i}">ลบรายการ</button></div>`).join('');
    }
    function editView() {
      const p=people.find(p=>p.id===state.edit);
      content.innerHTML=`<h2>${p?'แก้ไขพนักงาน':'เพิ่มพนักงาน'}</h2><form id="team-employee-form"><label>รูปพนักงาน<input type="file" accept="image/jpeg,image/png,image/webp" id="team-photo"></label><div id="team-photo-preview">${state.photo?`<img class="team-file-preview" alt="รูปที่เลือก" src="${state.photo}">`:''}</div><label>ชื่อพนักงาน<input name="name" maxlength="100" required value="${escape(p?.name||'')}"></label><label>ชื่อเล่น<input name="nickname" maxlength="40" value="${escape(p?.nickname||'')}"></label><label>ตำแหน่ง<input name="position" maxlength="80" required value="${escape(p?.position||'')}"></label><label>เริ่มงานวันที่<input name="start" type="date" required value="${p?.start||today}" max="${today}"></label><label>ค่าแรงต่อวัน<input name="daily" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" required value="${p?(rateOn(p,today)/100).toFixed(2):''}"></label>${p?'<p class="team-secondary">อัตราใหม่เริ่มใช้ 14 ก.ย. 2569</p>':''}<h3>เงินพิเศษประจำเดือน</h3><div id="team-extra-list">${extrasMarkup()}</div><button type="button" class="team-wide" id="team-add-extra">เพิ่มรายการเงินพิเศษ</button><label style="margin-top:1rem">รายละเอียดเพิ่มเติม<textarea name="notes" maxlength="500">${escape(p?.notes||'')}</textarea></label><div class="team-form-actions"><button class="team-primary team-wide" type="submit">บันทึก</button><button class="team-wide" type="button" id="team-cancel-edit">ยกเลิก</button></div></form>`;
    }
    function syncExtras() {
      state.extras=state.extras.map((x,i)=>({ label:content.querySelector(`[name="extra-label-${i}"]`).value, amount:parseMoney(content.querySelector(`[name="extra-amount-${i}"]`).value) }));
    }
    function parseMoney(value){if(!/^(0|[1-9]\d{0,6})(\.\d{1,2})?$/.test(value))throw new Error('กรอกจำนวนเงินไม่เกิน 2 ทศนิยม');const [whole,part='']=value.split('.');const n=Number(whole)*100+Number((part+'00').slice(0,2));if(n>100000000)throw new Error('จำนวนเงินสูงเกินกำหนด');return n;}
    function render() {
      announce(''); root.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
      if(state.tab==='attendance')attendanceView();else if(state.tab==='reports')reportsView();else settingsView();
      if(globalThis.lucide)lucide.createIcons();
    }
    root.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.dataset.tab){if(state.edit!==null){announce('บันทึกหรือยกเลิกการแก้ไขก่อนเปลี่ยนหน้า');return;}state.tab=b.dataset.tab;state.detail=null;render();return;}
      if(b.dataset.mark){const key=state.date+'|'+b.dataset.mark;records.set(key,b.dataset.status);const p=people.find(p=>p.id===b.dataset.mark);const card=b.closest('[data-person]');card.outerHTML=attendanceCard(p);const newCard=content.querySelector(`[data-person="${p.id}"]`);newCard.querySelector(`[data-status="${b.dataset.status}"]`).focus();const eligible=people.filter(p=>p.start<=state.date);content.querySelector('#team-checked').textContent=`เช็คแล้ว ${eligible.filter(p=>records.has(state.date+'|'+p.id)).length} จาก ${eligible.length} คน`;announce(`เลือก${label[b.dataset.status]}ให้${p.name}แล้ว ในตัวอย่าง`);return;}
      if(b.dataset.clear){const id=b.dataset.clear;b.closest('.team-saved').innerHTML=`<span>ล้างการเช็คชื่อนี้?</span><button type="button" data-confirm-clear="${id}" class="team-text-button">ยืนยันล้าง</button><button type="button" data-cancel-clear="${id}" class="team-text-button">ยกเลิก</button>`;return;}
      if(b.dataset.confirmClear){records.delete(state.date+'|'+b.dataset.confirmClear);render();announce('ล้างรายการในตัวอย่างแล้ว');return;}
      if(b.dataset.cancelClear){render();return;}
      if(b.id==='team-filter'){state.filter=!state.filter;render();return;}
      if(b.dataset.detail){state.detail=b.dataset.detail;render();return;}
      if(b.id==='team-back-report'){state.detail=null;render();return;}
      if(b.id==='team-add-person'){openEdit(null);return;}
      if(b.dataset.edit){openEdit(b.dataset.edit);return;}
      if(b.id==='team-cancel-edit'){state.edit=null;render();return;}
      if(b.id==='team-add-extra'||b.dataset.removeExtra!==undefined){try{syncExtras();if(b.id==='team-add-extra')state.extras.push({label:'',amount:0});else state.extras.splice(Number(b.dataset.removeExtra),1);content.querySelector('#team-extra-list').innerHTML=extrasMarkup();}catch(e){announce(e.message);}return;}
    });
    root.addEventListener('change',async event=>{
      const field=event.target;
      if(field.id==='team-date'){if(!field.value||field.value>today||field.value<'2026-08-01'){field.value=state.date;return;}state.date=field.value;render();}
      if(field.id==='team-month'){state.month=field.value;render();}
      if(field.id==='team-photo'){
        const file=field.files[0];if(!file)return;
        if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){announce('เลือกรูป JPEG, PNG หรือ WebP ไม่เกิน 5 MB');field.value='';return;}
        const url=URL.createObjectURL(file); const currentForm=state.edit; const submit=content.querySelector('[type="submit"]');submit.disabled=true;
        try{const img=new Image();img.src=url;await img.decode();if(img.naturalWidth*img.naturalHeight>20000000)throw new Error('รูปมีขนาดใหญ่เกินไป');const canvas=document.createElement('canvas');const scale=Math.min(1,192/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let result='';for(const quality of [.8,.65,.5,.35]){result=canvas.toDataURL('image/jpeg',quality);if(result.split(',')[1].length<=32768)break;}if(result.split(',')[1].length>32768)throw new Error('รูปยังใหญ่เกินไป กรุณาเลือกรูปอื่น');if(state.edit===currentForm){state.photo=result;content.querySelector('#team-photo-preview').innerHTML=`<img class="team-file-preview" alt="รูปที่เลือก" src="${result}">`;announce('เลือกรูปแล้ว');}}
        catch(e){announce(e.message==='รูปมีขนาดใหญ่เกินไป'?e.message:'อ่านรูปไม่สำเร็จ กรุณาเลือกรูปอื่น');}finally{URL.revokeObjectURL(url);if(submit.isConnected)submit.disabled=false;}
      }
    });
    root.addEventListener('submit',event=>{
      if(event.target.id!=='team-employee-form')return;event.preventDefault();
      try{syncExtras();const form=new FormData(event.target);const daily=parseMoney(form.get('daily'));const name=form.get('name').trim();const position=form.get('position').trim();if(!name||!position||state.extras.some(x=>!x.label.trim()))throw new Error('กรอกชื่อ ตำแหน่ง และชื่อรายการให้ครบ');let person=people.find(p=>p.id===state.edit);const isNew=!person;if(!person){person={id:'demo-'+crypto.randomUUID(),rates:[]};people.push(person);}Object.assign(person,{name,nickname:form.get('nickname').trim(),position,start:form.get('start'),notes:form.get('notes'),photo:state.photo,extras:state.extras.map(x=>({...x}))});if(isNew)person.rates.push({date:person.start,amount:daily});else if(rateOn(person,today)!==daily){person.rates=person.rates.filter(r=>r.date!==today);person.rates.push({date:today,amount:daily});}if(isNew)monthlyExtras.set('2026-09|'+person.id,person.extras.map(x=>({...x})));state.edit=null;render();announce('เก็บการแก้ไขในตัวอย่างแล้ว');}
      catch(e){announce(e.message);}
    });
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--team-copy',state.fontSize+'rem')});tweak.addSlider(state,'fontSize',{label:'ขนาดตัวอักษร',min:1.2,max:1.4,step:.1,unit:'rem'});}
  })();
  </script>
</div>

</body></html>
