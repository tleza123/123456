<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard • DE 06</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --main-blue: #003566; --main-blue-light: #004e98;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #ffffff; --card-border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; margin: 0; padding: 20px; color: #1e293b; }
    
    .page-header { text-align: center; color: white; margin-bottom: 25px; }
    .page-header h1 { font-size: 24px; margin: 0 0 4px 0; }
    
    .box { background: var(--card-bg); max-width: 700px; margin: 0 auto 20px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .box h2 { color: var(--main-blue); font-size: 18px; margin: 0 0 15px 0; }
    
    label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 10px 14px; margin: 0 0 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; }
    textarea { min-height: 80px; font-family: monospace; }
    
    button { background: linear-gradient(135deg, var(--main-blue) 0%, var(--main-blue-light) 100%); color: white; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 600; }
    .btn-success { background: linear-gradient(135deg, #059669 0%, #10b981 100%) !important; }
    .btn-danger { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%) !important; width: auto; padding: 6px 12px; font-size: 12px;}
    
    .task-row { background: #f8fafc; padding: 18px; border: 1px solid #e2e8f0; margin-bottom: 14px; border-radius: 14px; border-left: 4px solid var(--main-blue); }
    .task-header { font-weight: 700; font-size: 15px; color: var(--main-blue); display: flex; align-items: center; justify-content: space-between; }
    .field-row { display: flex; gap: 10px; }
    .field-row > div { flex: 1; }
    
    .msg-success { background: #f0fdf4; color: #16a34a; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: 500;}
    .msg-error { background: #fef2f2; color: #dc2626; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: 500;}
    .msg-loading { background: #fefce8; color: #a16207; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: 500;}
  </style>
</head>
<body>

<div class="page-header">
  <h1>⚙️ Admin Dashboard</h1>
  <p>ระบบจัดการหลังบ้าน (Firebase)</p>
</div>

<!-- Login Box -->
<div class="box" id="loginBox">
  <h2>🔐 เข้าสู่ระบบหลังบ้าน</h2>
  <label>รหัสผ่านแอดมิน (ใส่รหัสผ่านเดิม หรือเว้นว่างถ้าไม่ได้ตั้ง)</label>
  <input type="password" id="adminPass" placeholder="รหัสผ่าน">
  <button onclick="loadData()">เข้าสู่ระบบ →</button>
  <div id="loginMsg"></div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" style="display:none;">

  <div class="box">
    <h2>💳 ตั้งค่าการชำระเงิน</h2>
    <label>เบอร์พร้อมเพย์ (รับเงิน)</label>
    <input type="text" id="cfg_promptpay" placeholder="เช่น 0643040487">
    <label>ชื่อบัญชี</label>
    <input type="text" id="cfg_accountName" placeholder="เช่น นายพิชยะ ประจิตต์">
    <label>ID โฟลเดอร์ Google Drive (เก็บสลิป - ไม่ต้องเปลี่ยนถ้าอันเดิมใช้ได้)</label>
    <input type="text" id="cfg_folder" placeholder="Google Drive Folder ID">
  </div>

  <div class="box">
    <h2>📅 จัดการกิจกรรม (แสดงบนหน้าเว็บ)</h2>
    <div id="tasksContainer"></div>
    <button class="btn-success" onclick="addTask()">+ เพิ่มกิจกรรมใหม่</button>
  </div>

  <div class="box" style="text-align: center;">
    <button onclick="saveData()" style="font-size: 17px; padding: 14px;">💾 บันทึกการตั้งค่าทั้งหมด</button>
    <div id="msg"></div>
  </div>
</div>

<script>
  // =============================================
  // ⚙️ Firebase Config
  // =============================================
  firebase.initializeApp({
    apiKey: "AIzaSyBzlyOGkiO0QZ9C37Psv1K4zPfJuUtq6G0",
    authDomain: "de06-af21e.firebaseapp.com",
    projectId: "de06-af21e",
    storageBucket: "de06-af21e.firebasestorage.app",
    messagingSenderId: "177448084810",
    appId: "1:177448084810:web:b10aae7fef65dfa504cdb3"
  });

  var db = firebase.firestore();
  let appTasks = [];

  // =============================================
  // 🔐 Load Data
  // =============================================
  async function loadData() {
    const msgEl = document.getElementById('loginMsg');
    msgEl.innerHTML = '<div class="msg-loading">⏳ กำลังเชื่อมต่อ Firebase...</div>';
    
    try {
      // โหลด Config
      const configDoc = await db.collection('config').doc('main').get();
      if (configDoc.exists) {
        const data = configDoc.data();
        document.getElementById('cfg_promptpay').value = data.PROMPTPAY_NUMBER || '';
        document.getElementById('cfg_accountName').value = data.ACCOUNT_NAME || '';
        document.getElementById('cfg_folder').value = data.FOLDER_ID || '';
      }

      // โหลด Activities
      const activitiesSnap = await db.collection('activities').orderBy('order').get();
      appTasks = [];
      activitiesSnap.forEach(doc => {
        appTasks.push({ id: doc.id, ...doc.data() });
      });

      // ถ้าไม่มีกิจกรรมเลย (เพิ่งเปิดใช้งานครั้งแรก) ให้สร้าง "จองเสื้อ" เป็นค่าเริ่มต้น
      if (appTasks.length === 0) {
        appTasks.push({
          id: 'booking-shirt',
          icon: '👕',
          title: 'จองเสื้อช็อป DE 06',
          desc: 'เปิดระบบให้สั่งจองเสื้อช็อปสาขาวิชา',
          endDate: '2026-08-31T23:59',
          action: "goToSection('booking-section')",
          htmlCode: '',
          order: 1
        });
      }

      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      renderTasks();
    } catch(e) {
      msgEl.innerHTML = '<div class="msg-error">❌ ติดต่อเซิร์ฟเวอร์ไม่ได้: ' + e.message + '</div>';
    }
  }

  // =============================================
  // 📋 Render Tasks
  // =============================================
  function renderTasks() {
    const box = document.getElementById('tasksContainer');
    box.innerHTML = '';
    
    appTasks.forEach((t, i) => {
      const taskEl = document.createElement('div');
      taskEl.className = 'task-row';
      taskEl.innerHTML = `
        <div class="task-header" style="margin-bottom:15px;">
          <span>${t.icon || '📌'} กิจกรรมที่ ${i+1}</span>
          <button class="btn-danger" onclick="removeTask(${i})">ลบ</button>
        </div>
        <div class="field-row">
          <div style="flex:0 0 80px;"><label>ไอคอน</label><input type="text" value="${t.icon || ''}" onchange="appTasks[${i}].icon=this.value" style="text-align:center;"></div>
          <div><label>ชื่อกิจกรรม</label><input type="text" value="${t.title || ''}" onchange="appTasks[${i}].title=this.value"></div>
        </div>
        <label>รายละเอียด</label>
        <input type="text" value="${t.desc || ''}" onchange="appTasks[${i}].desc=this.value">
        <div class="field-row">
          <div><label>ID กิจกรรม (ห้ามซ้ำ)</label><input type="text" value="${t.id || ''}" onchange="appTasks[${i}].id=this.value"></div>
          <div><label>วันหมดเวลา</label><input type="datetime-local" value="${t.endDate || ''}" onchange="appTasks[${i}].endDate=this.value"></div>
        </div>
        
        <label style="color:var(--main-blue); margin-top:10px;">คำสั่ง Action (หน้าที่จะให้ลิงก์ไป)</label>
        <select onchange="appTasks[${i}].action=this.value; appTasks[${i}].htmlCode=''; renderTasks();">
          <option value="goToSection('booking-section')" ${t.action.includes('booking-section') ? 'selected' : ''}>🔗 ไปที่หน้า จองเสื้อช็อป (ระบบเดิม)</option>
          <option value="custom" ${t.htmlCode ? 'selected' : ''}>📝 สร้างฟอร์มเอง (Custom HTML)</option>
        </select>
        
        <div style="display: ${t.htmlCode || (!t.action.includes('booking-section')) ? 'block' : 'none'};">
          <label>HTML Code สำหรับแบบฟอร์ม</label>
          <textarea onchange="appTasks[${i}].htmlCode=this.value; appTasks[${i}].action='goToSection(\\'dynamic-'+appTasks[${i}].id+'\\')'" placeholder="ใส่โค้ด HTML ตรงนี้...">${t.htmlCode || ''}</textarea>
        </div>
      `;
      box.appendChild(taskEl);
    });
  }

  function addTask() {
    appTasks.push({ 
      id: 'activity-' + Date.now(), icon: '📌', title: 'กิจกรรมใหม่', desc: '', 
      endDate: '2026-12-31T23:59', action: "goToSection('booking-section')", htmlCode: '', order: appTasks.length + 1
    });
    renderTasks();
  }

  function removeTask(index) {
    if (confirm('ยืนยันการลบ?')) {
      appTasks.splice(index, 1);
      renderTasks();
    }
  }

  // =============================================
  // 💾 Save Data to Firebase
  // =============================================
  async function saveData() {
    const msgEl = document.getElementById('msg');
    msgEl.className = 'msg-loading'; msgEl.innerText = '⏳ กำลังบันทึกไปที่ Firebase...';
    
    try {
      // 1. Save Config
      await db.collection('config').doc('main').set({
        PROMPTPAY_NUMBER: document.getElementById('cfg_promptpay').value,
        ACCOUNT_NAME: document.getElementById('cfg_accountName').value,
        FOLDER_ID: document.getElementById('cfg_folder').value
      }, { merge: true });

      // 2. Save Activities (ใช้ Batch Write)
      const batch = db.batch();
      
      // ลบกิจกรรมเก่าทิ้งทั้งหมดก่อน (เพื่อป้องกันขยะ)
      const oldDocs = await db.collection('activities').get();
      oldDocs.forEach(doc => { batch.delete(doc.ref); });

      // เพิ่มกิจกรรมใหม่เข้าไป
      appTasks.forEach((t, index) => {
        const docRef = db.collection('activities').doc(t.id);
        const taskData = { ...t, order: index + 1 };
        batch.set(docRef, taskData);
      });

      await batch.commit();

      msgEl.className = 'msg-success';
      msgEl.innerText = '✅ บันทึกข้อมูลสำเร็จเรียบร้อย!';
    } catch(e) {
      msgEl.className = 'msg-error';
      msgEl.innerText = '❌ เกิดข้อผิดพลาด: ' + e.message;
    }
  }
</script>
</body>
</html>
