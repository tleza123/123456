<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard • DE 06</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background: #f1f5f9; padding: 20px; }
    .box { background: white; max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Prompt'; }
    button { background: #003566; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
    .task-row { background: #f8fafc; padding: 10px; border: 1px dashed #ccc; margin-bottom: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box" id="loginBox">
    <h2>เข้าสู่ระบบหลังบ้าน</h2>
    <input type="password" id="adminPass" placeholder="รหัสผ่าน">
    <button onclick="loadData()">เข้าสู่ระบบ</button>
  </div>

  <div class="box" id="adminBox" style="display:none; margin-top: 20px;">
    <h2 style="color: #003566;">⚙️ ตั้งค่าระบบ (อัปเดตไปที่หน้าเว็บทันที)</h2>
    
    <label>เบอร์พร้อมเพย์ (รับเงิน):</label>
    <input type="text" id="cfg_promptpay">
    <label>ชื่อบัญชี:</label>
    <input type="text" id="cfg_accountName">
    <label>ID โฟลเดอร์ Google Drive (เก็บสลิป):</label>
    <input type="text" id="cfg_folder">
    
    <hr style="margin:20px 0;">
    <h3>📅 จัดการกิจกรรม (เมนูหน้าโฮม)</h3>
    <div id="tasksContainer"></div>
    <button onclick="addTask()" style="background: #10b981; margin-bottom: 20px;">+ เพิ่มกิจกรรมใหม่</button>

    <button onclick="saveData()">💾 บันทึกการตั้งค่าทั้งหมด</button>
    <div id="msg" style="margin-top:10px; color:green; text-align:center;"></div>
  </div>

<script>
  // ⚙️ วางลิงก์ API เดิมตรงนี้ครับ!
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbuIDnYshcvKvOqEcgdhGSNLKg5tCYlScyCS_LC727Wud49RfKob4LtKmu8apbGhnhQg/exec';
  let appTasks = [];

  async function loadData() {
    document.getElementById('msg').innerText = "กำลังดึงข้อมูล...";
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAppConfig' }) });
    const data = await res.json();
    if (data.success) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminBox').style.display = 'block';
      
      document.getElementById('cfg_promptpay').value = data.config.PROMPTPAY_NUMBER || '';
      document.getElementById('cfg_accountName').value = data.config.ACCOUNT_NAME || '';
      document.getElementById('cfg_folder').value = data.config.FOLDER_ID || '';
      
      appTasks = data.tasks || [];
      renderTasks();
      document.getElementById('msg').innerText = "";
    }
  }

  function renderTasks() {
    const box = document.getElementById('tasksContainer');
    box.innerHTML = '';
    appTasks.forEach((t, i) => {
      box.innerHTML += `
        <div class="task-row">
          <input type="text" placeholder="ไอคอน (เช่น 👕)" value="${t.icon}" onchange="appTasks[${i}].icon=this.value" style="width:20%">
          <input type="text" placeholder="ชื่อกิจกรรม" value="${t.title}" onchange="appTasks[${i}].title=this.value" style="width:75%">
          <input type="text" placeholder="รายละเอียด" value="${t.desc}" onchange="appTasks[${i}].desc=this.value">
          <input type="datetime-local" placeholder="วันหมดเวลา (YYYY-MM-DDTHH:MM)" value="${t.endDate}" onchange="appTasks[${i}].endDate=this.value">
          <input type="text" placeholder="คำสั่ง Action (เช่น goToSection('booking-section'))" value="${t.action}" onchange="appTasks[${i}].action=this.value">
          <button style="background:red; width:auto; padding:5px 10px;" onclick="appTasks.splice(${i}, 1); renderTasks();">ลบกิจกรรมนี้</button>
        </div>
      `;
    });
  }

  function addTask() {
    appTasks.push({ id: 'task-'+Date.now(), icon: '📌', title: 'กิจกรรมใหม่', desc: '', endDate: '2026-12-31T23:59', action: "alert('เปิดเร็วๆนี้')" });
    renderTasks();
  }

  async function saveData() {
    document.getElementById('msg').innerText = "กำลังบันทึก...";
    const payload = {
      action: 'saveAppConfig',
      password: document.getElementById('adminPass').value,
      configData: {
        PROMPTPAY_NUMBER: document.getElementById('cfg_promptpay').value,
        ACCOUNT_NAME: document.getElementById('cfg_accountName').value,
        FOLDER_ID: document.getElementById('cfg_folder').value
      },
      tasksData: appTasks
    };
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    const result = await res.json();
    document.getElementById('msg').innerText = result.message;
    if(!result.success) alert(result.message);
  }
</script>
</body>
</html>
